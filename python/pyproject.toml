[project]
name = "coilcal"
version = "0.1.0"
description = "Turn-level models of single-layer coils: field, inductance, self-resonance, VNA view"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ivan Galinskiy" }
]
requires-python = ">=3.12"
dependencies = [
    "magpylib>=6.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyside6-essentials>=6.12.0",
    "scipy>=1.18.1",
]

[project.urls]
Repository = "https://github.com/ivan-galinskiy/coil-calculator"
"Browser app" = "https://ivan-galinskiy.github.io/coil-calculator/"

[project.scripts]
coilcal-gui = "coilcal.gui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown (AGENTS.md): only resolve packages published >= 7 days ago.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
python_version = "3.12"
files = ["src/coilcal"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["scipy.*", "magpylib.*"]
ignore_missing_imports = true
