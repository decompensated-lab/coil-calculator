[project]
name = "coilcal"
version = "0.1.0"
description = "Quasi-static field, inductance and mutual-inductance modelling of single-layer coils"
readme = "README.md"
authors = [
    { name = "Ivan Galinskiy" }
]
requires-python = ">=3.12"
dependencies = [
    "magpylib>=6.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyside6-essentials>=6.12.0",
    "scipy>=1.18.1",
]

[project.scripts]
coilcal-gui = "coilcal.gui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown (AGENTS.md): only resolve packages published >= 7 days ago.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
